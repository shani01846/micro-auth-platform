<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול - Spring Boot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            color: #444;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        input {
            width: 95%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-product { background-color: #28a745; }
        .btn-product:hover { background-color: #218838; }
        
        .btn-user { background-color: #007bff; }
        .btn-user:hover { background-color: #0069d9; }
        
        .btn-login { background-color: #17a2b8; }
        .btn-login:hover { background-color: #138496; }
        
        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #c82333; }
        
        .btn-view { background-color: #6c757d; }
        .btn-view:hover { background-color: #5a6268; }

        .message {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
            min-height: 20px;
        }
        
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            margin: 5px 0;
            border-radius: 4px;
            background: #f9f9f9;
        }
        
        .product-info {
            flex-grow: 1;
        }
        
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <h1>מערכת ניהול ובדיקת API</h1>
    <br>

    <div class="grid-container">

        <div class="card">
            <h2>📦 הוספת מוצר חדש</h2>
            <input type="text" id="prodName" placeholder="שם המוצר">
            <input type="number" id="prodPrice" placeholder="מחיר">
            <button class="btn-product" onclick="submitProduct()">שלח מוצר לשרת</button>
            <div id="productMsg" class="message"></div>
        </div>

        <div class="card">
            <h2>👤 רישום משתמש חדש</h2>
            <input type="text" id="userName" placeholder="שם מלא">
            <input type="text" id="userAddress" placeholder="כתובת">
            <input type="text" id="userPhone" placeholder="מספר טלפון">
            <button class="btn-user" onclick="submitUser()">הרשם במערכת</button>
            <div id="userMsg" class="message"></div>
        </div>

        <div class="card">
            <h2>🔑 התחברות (לפי מזהה)</h2>
            <p style="font-size: 13px; color: #777; margin: 0;">בגלל שזה H2, המזהה (ID) של המשתמש הראשון שתרשום יהיה 1, השני 2 וכן הלאה.</p>
            <input type="number" id="loginId" placeholder="הכנס מזהה משתמש (ID)">
            <button class="btn-login" onclick="loginUser()">התחבר</button>
            <div id="loginMsg" class="message"></div>
        </div>

        <div class="card">
            <h2>🛡️ ניהול מוצרים - Admin</h2>
            <button class="btn-view" onclick="loadProducts()">הצג את כל המוצרים</button>
            <div id="productsList" style="margin: 15px 0; max-height: 200px; overflow-y: auto;"></div>
            <hr>
            <input type="number" id="deleteProductId" placeholder="מזהה מוצר למחיקה">
            <button class="btn-delete" onclick="deleteSpecificProduct()">מחק מוצר ספציפי</button>
            <button class="btn-delete" onclick="deleteAllProducts()">מחק את כל המוצרים</button>
            <div id="adminMsg" class="message"></div>
        </div>

    </div>

    <script>
        // 1. פונקציית הוספת מוצר
        function submitProduct() {
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;

            fetch('/products/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, price: parseFloat(price) })
            })
            .then(res => res.text())
            .then(data => {
                document.getElementById('productMsg').style.color = "green";
                document.getElementById('productMsg').innerText = data;
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
            })
            .catch(() => document.getElementById('productMsg').innerText = 'שגיאה בשליחה');
        }

        // 2. פונקציית רישום משתמש
        function submitUser() {
            const name = document.getElementById('userName').value;
            const address = document.getElementById('userAddress').value;
            const phone = document.getElementById('userPhone').value;

            // שים לב: אנחנו שולחים כרגע אובייקט פשוט ללא ה-Credential כדי לא להסתבך, ה-JPA יקבל אותו כ-null
            const userData = {
                name: name,
                address: address,
                phoneNumber: phone,
                credential: null 
            };

            fetch('/users/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            })
            .then(res => res.text())
            .then(data => {
                document.getElementById('userMsg').style.color = "green";
                document.getElementById('userMsg').innerText = data + "!";
                document.getElementById('userName').value = '';
                document.getElementById('userAddress').value = '';
                document.getElementById('userPhone').value = '';
            })
            .catch(() => document.getElementById('userMsg').innerText = 'שגיאה ברישום המשתמש');
        }

        // 3. פונקציית התחברות סימולטיבית (משיכת משתמש לפי מזהה)
        function loginUser() {
            const id = document.getElementById('loginId').value;
            const msgDiv = document.getElementById('loginMsg');

            if(!id) {
                msgDiv.innerText = "נא להזין ID";
                return;
            }

            // פנייה ל-GET שמחזירה משתמש לפי ID מה-UserController
            fetch('/users/' + id)
            .then(res => {
                if (!res.ok) throw new Error();
                return res.json();
            })
            .then(user => {
                if (user && user.name) {
                    msgDiv.style.color = "blue";
                    msgDiv.innerText = "ברוך הבא, " + user.name + "! התחברת בהצלחה.";
                } else {
                    msgDiv.style.color = "red";
                    msgDiv.innerText = "משתמש לא נמצא בבסיס הנתונים.";
                }
            })
            .catch(() => {
                msgDiv.style.color = "red";
                msgDiv.innerText = "משתמש לא נמצא או שגיאת שרת.";
            });
        }

        // 4. פונקציות Admin - ניהול מוצרים
        function loadProducts() {
            fetch('/products')
            .then(res => res.json())
            .then(products => {
                const listDiv = document.getElementById('productsList');
                if (products.length === 0) {
                    listDiv.innerHTML = '<p style="color: #999;">אין מוצרים במערכת</p>';
                    return;
                }
                
                let html = '<div>';
                products.forEach(product => {
                    html += `<div class="product-item">`;
                    html += `<div class="product-info">`;
                    html += `<strong>ID:</strong> ${product.id} | <strong>שם:</strong> ${product.name} | <strong>מחיר:</strong> ₪${product.price}`;
                    html += `</div>`;
                    html += `<button class="delete-btn" onclick="deleteProductById(${product.id}, '${product.name}')">מחק</button>`;
                    html += `</div>`;
                });
                html += '</div>';
                listDiv.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('productsList').innerHTML = '<p style="color: red;">שגיאה בטעינת המוצרים</p>';
            });
        }

        function deleteProductById(productId, productName) {
            if (!confirm(`האם את בטוחה שברצונך למחוק את המוצר "${productName}"?`)) {
                return;
            }

            fetch(`/products/${productId}`, { method: 'DELETE' })
            .then(res => {
                const msgDiv = document.getElementById('adminMsg');
                if (res.ok) {
                    msgDiv.style.color = "green";
                    msgDiv.innerText = `המוצר "${productName}" נמחק בהצלחה!`;
                    loadProducts();
                } else {
                    msgDiv.style.color = "red";
                    msgDiv.innerText = `שגיאה במחיקת המוצר "${productName}"`;
                }
            })
            .catch(() => {
                document.getElementById('adminMsg').style.color = "red";
                document.getElementById('adminMsg').innerText = "שגיאה במחיקת המוצר";
            });
        }

        function deleteSpecificProduct() {
            const id = document.getElementById('deleteProductId').value;
            const msgDiv = document.getElementById('adminMsg');
            
            if (!id) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "נא להזין מזהה מוצר";
                return;
            }

            fetch(`/products/${id}`, { method: 'DELETE' })
            .then(res => {
                if (res.ok) {
                    msgDiv.style.color = "green";
                    msgDiv.innerText = `מוצר מספר ${id} נמחק בהצלחה!`;
                    document.getElementById('deleteProductId').value = '';
                    loadProducts(); // רענון הרשימה
                } else {
                    msgDiv.style.color = "red";
                    msgDiv.innerText = `מוצר מספר ${id} לא נמצא`;
                }
            })
            .catch(() => {
                msgDiv.style.color = "red";
                msgDiv.innerText = "שגיאה במחיקת המוצר";
            });
        }

        function deleteAllProducts() {
            if (!confirm('האם אתה בטוח שברצונך למחוק את כל המוצרים?')) {
                return;
            }

            fetch('/products/all', { method: 'DELETE' })
            .then(res => res.text())
            .then(message => {
                const msgDiv = document.getElementById('adminMsg');
                msgDiv.style.color = "green";
                msgDiv.innerText = message;
                loadProducts(); // רענון הרשימה
            })
            .catch(() => {
                document.getElementById('adminMsg').style.color = "red";
                document.getElementById('adminMsg').innerText = "שגיאה במחיקת המוצרים";
            });
        }
    </script>
</body>
</html>
